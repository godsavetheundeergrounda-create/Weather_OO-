[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-aggregator"
version = "0.2.0"
description = "Многопользовательский агрегатор погоды с аккаунтами и персональным избранным"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["aiohttp>=3.9", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
weather = "weather_aggregator.cli:run"
weather-web = "weather_aggregator.web.__main__:run"
weather-demo = "weather_aggregator.demo:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"weather_aggregator.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]
